# FritzPlot — mise task configuration
#
# All build, clean, and Docker operations are defined here as mise tasks.
# Run any task with:  mise run <task>
# List all tasks with: mise tasks

[tools]
node = "20"

# NOTE: Docker task variables (FRITZPLOT_IMAGE, FRITZPLOT_TAG, etc.) are NOT
# defined here. They use shell parameter expansion (${VAR:-default}) inside the
# task commands so that values set in your shell are respected. If you define
# them in a [env] block, mise would override your shell's inline variables.

# ---------------------------------------------------------------------------
# Build tasks
# ---------------------------------------------------------------------------

[tasks.build]
description = "Build the full project (client + server)"
run = "npm run build"
depends = ["build:client", "build:server"]

[tasks."build:client"]
description = "Build the frontend (Vite)"
run = "npm run build:client"

[tasks."build:server"]
description = "Build the backend (TypeScript)"
run = "npm run build:server"

[tasks.typecheck]
description = "Type-check the project without emitting"
run = "npm run typecheck"

[tasks.test]
description = "Run the unit test suite"
run = "npm test"

[tasks.dev]
description = "Run the backend with hot reload (dev)"
run = "npm run dev:server"

[tasks."dev:client"]
description = "Run the Vite dev server"
run = "npm run dev:client"

# ---------------------------------------------------------------------------
# Clean task
# ---------------------------------------------------------------------------

[tasks.clean]
description = "Remove build artifacts and node_modules"
run = "rm -rf dist node_modules"

# ---------------------------------------------------------------------------
# Docker tasks
# ---------------------------------------------------------------------------

[tasks."docker:buildx:setup"]
description = "Create and bootstrap the multi-arch buildx builder (with QEMU)"
run = "docker buildx create --name ${FRITZPLOT_BUILDER:-fritzplot-builder} --driver docker-container --use 2>/dev/null || docker buildx use ${FRITZPLOT_BUILDER:-fritzplot-builder}; docker buildx inspect --bootstrap ${FRITZPLOT_BUILDER:-fritzplot-builder}"

[tasks."docker:build"]
description = "Build the Docker image for the current architecture (loads into local daemon)"
run = "docker buildx build --builder ${FRITZPLOT_BUILDER:-fritzplot-builder} --platform linux/amd64 -t ${FRITZPLOT_IMAGE:-fritzplot}:${FRITZPLOT_TAG:-latest} --load ."

[tasks."docker:build:local"]
description = "Build the Docker image for the current architecture only"
run = "docker build -t ${FRITZPLOT_IMAGE:-fritzplot}:${FRITZPLOT_TAG:-latest} ."

[tasks."docker:push"]
description = "Build and push the multi-arch image (amd64 + arm64) to the registry"
run = "docker buildx build --builder ${FRITZPLOT_BUILDER:-fritzplot-builder} --platform ${FRITZPLOT_PLATFORMS:-linux/amd64,linux/arm64} -t ${FRITZPLOT_IMAGE:-fritzplot}:${FRITZPLOT_TAG:-latest} --push ."

[tasks."docker:run"]
description = "Run the container locally (requires FRITZBOX_URL, FRITZBOX_PASSWORD, APP_USER, APP_PASSWORD)"
run = "docker run --rm -p 3000:3000 -e FRITZBOX_URL=$FRITZBOX_URL -e FRITZBOX_PASSWORD=$FRITZBOX_PASSWORD -e FRITZBOX_USER=$FRITZBOX_USER -e APP_USER=$APP_USER -e APP_PASSWORD=$APP_PASSWORD ${FRITZPLOT_IMAGE:-fritzplot}:${FRITZPLOT_TAG:-latest}"

[tasks."docker:clean"]
description = "Remove the local image and dangling build cache"
run = "docker rmi ${FRITZPLOT_IMAGE:-fritzplot}:${FRITZPLOT_TAG:-latest} 2>/dev/null || true; docker builder prune -f"
